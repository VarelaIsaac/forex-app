name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: user
          POSTGRES_DB: trading_app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:user@localhost:5432/trading_app_db?schema=public
      PORT: 3001
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret' }}
      CORS_ORIGIN: http://localhost:3000
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN || 'example.us.auth0.com' }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE || 'https://example.us.auth0.com/api/v2/' }}
    defaults:
      run:
        working-directory: pancake-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pancake-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        run: npm run test -- --runInBand

      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_API_BASE: http://localhost:3001
      NEXT_PUBLIC_APP_NAME: Pancake
      NEXT_PUBLIC_APP_ENV: test
      APP_BASE_URL: http://localhost:3000
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN || 'example.us.auth0.com' }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID || 'test-client-id' }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET || 'test-client-secret' }}
      AUTH0_SECRET: ${{ secrets.AUTH0_SECRET || 'test-auth0-secret' }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE || 'https://example.us.auth0.com/api/v2/' }}
    defaults:
      run:
        working-directory: pancake-nextjs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pancake-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build